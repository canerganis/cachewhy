<svg xmlns="http://www.w3.org/2000/svg" width="960" height="170" viewBox="0 0 960 170" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><rect x="0" y="10" width="222" height="150" rx="14" fill="#161b22" stroke="#30363d"/><text x="111" y="78" fill="#f5a524" font-size="48" font-weight="800" text-anchor="middle">$645</text><text x="111" y="112" fill="#c9d1d9" font-size="15" text-anchor="middle">API list-price cost of</text><text x="111" y="134" fill="#8b949e" font-size="15" text-anchor="middle">cache rebuilds in a week</text><rect x="246" y="10" width="222" height="150" rx="14" fill="#161b22" stroke="#30363d"/><text x="357" y="78" fill="#f5a524" font-size="48" font-weight="800" text-anchor="middle">497</text><text x="357" y="112" fill="#c9d1d9" font-size="15" text-anchor="middle">rebuilds found across</text><text x="357" y="134" fill="#8b949e" font-size="15" text-anchor="middle">45,362 requests</text><rect x="492" y="10" width="222" height="150" rx="14" fill="#161b22" stroke="#30363d"/><text x="603" y="78" fill="#f5a524" font-size="48" font-weight="800" text-anchor="middle">88%</text><text x="603" y="112" fill="#c9d1d9" font-size="15" text-anchor="middle">of that cost: cache</text><text x="603" y="134" fill="#8b949e" font-size="15" text-anchor="middle">expired while idle</text><rect x="738" y="10" width="222" height="150" rx="14" fill="#161b22" stroke="#30363d"/><text x="849" y="78" fill="#f5a524" font-size="48" font-weight="800" text-anchor="middle">83%</text><text x="849" y="112" fill="#c9d1d9" font-size="15" text-anchor="middle">came from subagents,</text><text x="849" y="134" fill="#8b949e" font-size="15" text-anchor="middle">outside /usage's view</text></svg>