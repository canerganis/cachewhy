<svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" viewBox="0 0 940 300" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<rect width="100%" height="100%" rx="12" fill="#0d1117"/>
<text x="470" y="40" fill="#f0f6fc" font-size="18" font-weight="bold" text-anchor="middle">How cachewhy finds a rebuild</text>
<rect x="30" y="70" width="190" height="130" rx="10" fill="#161b22" stroke="#79c0ff" stroke-width="1.5"/><text x="125" y="100" fill="#f0f6fc" font-weight="bold" text-anchor="middle" font-size="15">Local logs</text><text x="125" y="124" fill="#8b949e" text-anchor="middle" font-size="12">~/.claude/projects</text><text x="125" y="142" fill="#8b949e" text-anchor="middle" font-size="12">~/.codex/sessions</text><text x="125" y="160" fill="#8b949e" text-anchor="middle" font-size="12">read offline</text>
<line x1="220" y1="135" x2="252" y2="135" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="260" y="70" width="190" height="130" rx="10" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/><text x="355" y="100" fill="#f0f6fc" font-weight="bold" text-anchor="middle" font-size="15">Threads</text><text x="355" y="124" fill="#8b949e" text-anchor="middle" font-size="12">dedupe by request id</text><text x="355" y="142" fill="#8b949e" text-anchor="middle" font-size="12">main, subagents,</text><text x="355" y="160" fill="#8b949e" text-anchor="middle" font-size="12">workflows, Codex forks</text>
<line x1="450" y1="135" x2="482" y2="135" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="490" y="70" width="190" height="130" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/><text x="585" y="100" fill="#f0f6fc" font-weight="bold" text-anchor="middle" font-size="15">Rebuild check</text><text x="585" y="124" fill="#8b949e" text-anchor="middle" font-size="12">cache read &lt; half of</text><text x="585" y="142" fill="#8b949e" text-anchor="middle" font-size="12">the prefix the previous</text><text x="585" y="160" fill="#8b949e" text-anchor="middle" font-size="12">request had cached</text>
<line x1="680" y1="135" x2="712" y2="135" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="720" y="70" width="190" height="130" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="815" y="100" fill="#f0f6fc" font-weight="bold" text-anchor="middle" font-size="15">Cause + evidence</text><text x="815" y="124" fill="#8b949e" text-anchor="middle" font-size="12">confirmed: logged reason</text><text x="815" y="142" fill="#8b949e" text-anchor="middle" font-size="12">hypothesis: TTL, model,</text><text x="815" y="160" fill="#8b949e" text-anchor="middle" font-size="12">compaction, settings</text>
<text x="470" y="270" fill="#8b949e" font-size="13" text-anchor="middle">Cost = rebuilt tokens x (write or input price - cache read price), API list prices</text>
</svg>